<style>
    /* Container principal da seção do vídeo */
.video-local {
  text-align: center;
  margin: 40px auto;
  padding: 0 20px;
  max-width: 800px;
}

/* Título estilizado (fundo vermelho com texto branco) */
.titulo-video {
  background-color: #7c0000;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  font-size: 20px;
  font-weight: bold;
  color: #6e1d1d;
  text-align: center;
  margin-bottom: 15px;
  padding: 10px;
  border-radius: 4px;
}

/* Envoltório responsivo para manter a proporção 16:9 */
.video-responsive {
  position: relative;
  width: 100%;
  padding-bottom: 56.25%; /* Proporção 16:9 (altura relativa à largura) */
  height: 0;
  overflow: hidden;
  border-radius: 8px;
}

/* Ajusta o iframe para preencher 100% da caixa responsiva */
.video-responsive iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: 0;
}
</style>
