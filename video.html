<style>
/* Container principal da seção */
.video-local {
  text-align: center;
  margin: 40px auto;
  padding: 0 20px;
  max-width: 800px;
}

/* Título do vídeo */
.titulo-video {
  background-color: #7c0000;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  font-size: 20px;
  font-weight: bold;
  color: #ffffff;
  text-align: center;
  margin-bottom: 15px;
  padding: 10px; /* Adicionado para o texto não colar nas bordas do fundo */
  border-radius: 4px;
}

/* Containers para vídeos responsivos (proporção 16:9) */
.video-responsive,
.video-container {
  position: relative;
  width: 100%;
  padding-bottom: 56.25%; /* Proporção 16:9 */
  height: 0;
  overflow: hidden;
  border-radius: 8px;
}

/* Estilização dos iframes dentro dos containers responsivos */
.video-responsive iframe,
.video-container iframe,
.video-local iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: 0;
}
</style>
