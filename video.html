<style>

.video-local {
  text-align: center;
  margin: 40px auto;
  padding: 0 20px;
  max-width: 800px;   /* mesma largura máxima do mapa */
}

.video-local iframe {
  width: 100%;
  height: 450px;      /* mesma altura do mapa */
  border: 0;
  display: block;
  border-radius: 8px; /* opcional, fica igualzinho */
}
.video-local {
  text-align: center;
  margin: 40px auto;
  padding: 0 20px;
  max-width: 800px;          /* mesma largura do mapa */
}

.video-responsive {
  position: relative;
  width: 100%;
  padding-bottom: 56.25%;   /* 16:9 (9/16 = 0.5625) */
  height: 0;
  overflow: hidden;
  border-radius: 8px;
}
.titulo-video{
    background-color: #7c0000;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-size: 20px;
    font-weight: bold;
    color: #ffffff;
    text-align: center;
    margin-bottom: 15px;
}

.video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* Proporção 16:9 (9 / 16 = 0.5625) */
      height: 0;
      overflow: hidden;
    }

    /* O iframe ocupa 100% da área do container */
.video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

.video-responsive iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: 0;
}


</style>
